name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual run from the Actions tab (e.g. right after publishing a new article)
  workflow_dispatch:
  # Daily rebuild so new articles/projects from the dashboard get their own pre-rendered page
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (+ pre-render pages and sitemap)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy dist/ to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
